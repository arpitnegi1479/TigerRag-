[project]
name = "agentic-graphrag-backend"
version = "0.1.0"
description = "Backend for an Agentic GraphRAG intelligence system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.8.2",
  "neo4j>=5.18.0",
  "psycopg[binary]>=3.2.1",
  "pypdf>=4.2.0",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.3",
  "markdown>=3.0.1",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
